<style>
:root{--bg:#08110f;--panel:#101d19;--green:#00a86b;--gold:#e6bd62;--text:#f4f4ef;--muted:#aab8b1;--line:#294138}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17352a,#08110f 60%);font:16px/1.5 system-ui,sans-serif;color:var(--text)}
header{padding:17px max(18px,calc((100% - 980px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#07100edb;position:sticky;top:0}
.brand{font-weight:900;letter-spacing:.06em}.brand span{color:var(--gold)}main{max-width:980px;margin:auto;padding:28px 18px 60px}
.hero{padding:18px 0 28px}.eyebrow{color:var(--gold);font-size:.75rem;letter-spacing:.16em;font-weight:800;text-transform:uppercase}
h1{font-size:clamp(2.5rem,7vw,4.6rem);line-height:.98;letter-spacing:-.06em;margin:8px 0 14px}h1 em{color:var(--gold);font-style:normal}p,.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:linear-gradient(145deg,#13251e,#0d1714);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h2{font-size:1.2rem;margin:0 0 8px}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:.88rem;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#07110e;color:var(--text);font:inherit}.field textarea{min-height:82px}
button{padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:#14251e;color:var(--text);font-weight:750;cursor:pointer;margin:4px 5px 4px 0}button.primary{background:var(--green);border-color:var(--green);color:#04130d}button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:18px 0}.tab.active{background:var(--green);color:#04130d}
.case{border:1px solid var(--line);border-radius:11px;padding:13px;margin:10px 0;background:#0a1511}.status{font-size:.75rem;color:var(--gold);border:1px solid #66552e;border-radius:99px;padding:2px 8px;display:inline-block}
.hidden{display:none!important}.msg{min-height:23px;color:var(--gold);font-size:.9rem}.small{font-size:.8rem}.footer{border-top:1px solid var(--line);padding-top:18px;margin-top:30px;font-size:.8rem;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}header{padding:14px 18px}}

label{display:grid;gap:5px;margin:12px 0;font-size:.88rem;font-weight:700}
label input,label select,label textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#07110e;color:var(--text);font:inherit;font-weight:400}
label textarea{min-height:82px}.chk{display:flex;align-items:center;gap:8px}.chk input{width:auto}
a{color:var(--gold)}a.case{display:block;text-decoration:none;color:var(--text)}
.mut{color:var(--muted);font-size:.9rem}.arg{border-left:3px solid var(--gold);padding-left:10px;margin:10px 0}
.verdict{border-color:var(--gold);text-align:center}button.red{background:#b4443b;border-color:#b4443b;color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap}.ghost{background:none}
#toast{position:fixed;left:12px;right:12px;bottom:12px;padding:12px 14px;border-radius:10px;background:var(--green);color:#04130d;font-weight:700;display:none;z-index:9}
#toast.bad{background:#b4443b;color:#fff}

[hidden]{display:none!important}
body.court{background:radial-gradient(ellipse at 50% -10%,var(--cb1) 0,var(--cb2) 55%,var(--cb3) 100%) fixed}
body.court header{background:rgba(10,6,3,.85);border-bottom:1px solid var(--cbd)}
.cp{background:var(--cpn);border:1px solid var(--cbd);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 0 18px rgba(230,189,98,.08)}
.cbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:10px 14px;border:1px solid var(--cbd);border-radius:12px;background:var(--cpn);font-weight:700;font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:#777}.dot.live{background:#27d17f;box-shadow:0 0 8px #27d17f}
.cgrid{display:grid;gap:10px}.cgrid.top{grid-template-columns:1fr 1fr;margin-top:10px}.cgrid.top .bench{grid-column:1/-1;order:-1}
.cgrid.bot{grid-template-columns:1fr}
@media(min-width:760px){.cgrid.top{grid-template-columns:1fr 1.3fr 1fr}.cgrid.top .bench{grid-column:auto;order:0}.cgrid.bot{grid-template-columns:1fr 1fr 1fr}}
.cgrid .cp{margin:0}
.pl{border-color:#2f6fd6;background:rgba(10,25,55,.8)}.df{border-color:#c73a3a;background:rgba(50,12,14,.8)}
.tag{font-weight:800;letter-spacing:.05em;font-size:.82rem;margin-bottom:8px}.pl .tag{color:#6aa5ff}.df .tag{color:#ff7b7b}
.who{display:flex;gap:10px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.3rem;background:#2a1b0a;border:2px solid var(--gold);color:var(--gold);flex:none}
.you,.opp{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:7px;margin-top:4px}.you{background:var(--green);color:#04130d}.opp{background:#a83232;color:#fff}
.bench{text-align:center;padding:16px 10px;border:1px solid var(--cbd);border-radius:14px;background:linear-gradient(var(--bn1),var(--bn2))}
.seal{font-size:2.6rem;width:78px;height:78px;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 18px rgba(230,189,98,.35)}
.cols{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}
h3.bl{color:#6aa5ff}h3.rd{color:#ff7b7b}.cols h3{margin:0 0 6px}
.vd{display:inline-block;width:28px;height:28px;border-radius:50%;border:2px solid var(--cbd);margin-right:6px}.vd.on{background:var(--gold);border-color:var(--gold)}
.act{display:flex;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}.act i{width:9px;height:9px;border-radius:50%;background:#888;flex:none}.act i.p{background:#4a8dff}.act i.d{background:#ff5a5a}
.bell{text-decoration:none;position:relative;font-size:1.15rem;margin-right:12px}.badge{position:absolute;top:-8px;right:-12px;background:#e0453a;color:#fff;font-size:.62rem;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center;font-weight:800}
body.court,body.court-high{--cbd:#7a5a22;--cpn:rgba(22,13,6,.86);--cb1:#4a2c12;--cb2:#1a0f06;--cb3:#0b0603;--bn1:#2b1a0b;--bn2:#150c05}
body.court-appeal{--cbd:#6f86b3;--cpn:rgba(8,16,34,.88);--cb1:#1d3a6b;--cb2:#0b1730;--cb3:#050a16;--bn1:#14284d;--bn2:#0a1428}
body.court-supreme{--cbd:#b3263a;--cpn:rgba(24,6,10,.9);--cb1:#5a0f1c;--cb2:#1d0508;--cb3:#0a0204;--bn1:#3b0b14;--bn2:#1a0509}
body.court-appeal .cp,body.court-appeal .bench{border-radius:4px}
body.court-supreme .cp,body.court-supreme .bench{border-width:2px;box-shadow:0 0 22px rgba(179,38,58,.25)}
.mapsvg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px;background:#12261c;margin:10px 0}

.hasnav main{padding-bottom:104px}
.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:5px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(8,17,15,.97);border-top:1px solid #7a5a22;z-index:6}
.bn{flex:1;font-size:.66rem;padding:6px 2px;line-height:1.25;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);font-weight:700}
.bn .i{display:block;font-size:1.25rem}.bn.active{background:linear-gradient(#e6bd62,#b8902f);color:#1a1405;border-color:#e6bd62}

.mapimg{position:relative;max-width:520px;margin:6px auto;aspect-ratio:9/16;container-type:inline-size;border-radius:16px;overflow:hidden;border:1px solid #7a5a22;background:#0d1512}
.mapimg img{width:100%;height:100%;object-fit:cover;display:block}
.mapimg .hot{position:absolute;background:none;border:2px solid transparent;border-radius:12px;padding:0;min-height:0;color:#fff}
.mapimg .hot.sel{border-color:#e6bd62;box-shadow:0 0 18px #e6bd62aa}
.mapimg .hot span{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);white-space:nowrap;background:rgba(13,10,5,.88);border:1px solid #e6bd62;border-radius:9px;padding:3px 9px;font-size:3.1cqw;font-weight:800}
.mapimg .hot small{display:block;color:#e6bd62;font-size:2.4cqw;font-weight:600}
.mapimg .ad{position:absolute;display:grid;place-items:center;text-align:center;background:rgba(10,8,4,.7);border:1px solid #e6bd62;border-radius:4px;color:#e6bd62;font-weight:800;font-size:2.4cqw;line-height:1.1;padding:2px;min-height:0}
body.court-high::before,body.court-appeal::before,body.court-supreme::before{content:"";position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
body.court-high::before{background-image:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.84)),url(court-high.jpg.jpeg)}
body.court-appeal::before{background-image:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.84)),url(court-appeal.jpg.jpeg)}
body.court-supreme::before{background-image:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.84)),url(court-supreme.jpg.jpeg)}
.seal{overflow:hidden}.judgeimg{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%;display:block}
.avi{display:inline-block;border-radius:50%;background-size:400% 200%;background-repeat:no-repeat;border:2px solid var(--gold);flex:none;vertical-align:middle}
header,body.court header{background:#08110f!important;backdrop-filter:none!important}
.bnav{background:#08110f!important}.bn{background:#101d19}.bn.active{background:linear-gradient(#e6bd62,#b8902f)}

.anim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.anim .bird{animation:flyr linear infinite;will-change:transform}
.anim .bird path{animation:flap .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flyr{from{transform:translate(-160px,var(--y)) scale(var(--s))}to{transform:translate(1600px,calc(var(--y) - 70px)) scale(var(--s))}}
@keyframes flyl{from{transform:translate(1600px,var(--y)) scale(var(--s))}to{transform:translate(-160px,calc(var(--y) - 50px)) scale(var(--s))}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
.anim .drop{opacity:0;animation:jet var(--d,1.8s) ease-in-out infinite}
@keyframes jet{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}50%{transform:translate(calc(var(--dx)*.55),calc(var(--h)*-1))}100%{transform:translate(var(--dx),0);opacity:0}}
.anim .rip{fill:none;stroke:#cfe9ff;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:rip 3.6s ease-out infinite}
@keyframes rip{0%{transform:scale(.4);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.anim .drift{animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(110px)}}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}}
.mapvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}.mapimg.vid .mapvid{opacity:1}.mapimg.vid .anim{display:none}
</style></head>

}

function authView(mode){
  const t={signin:'Enter court',signup:'Create account',forgot:'Reset password'}[mode];
  const pw=mode!=='forgot';
  shell(`<section class="hero"><div class="eyebrow">The multiplayer courtroom</div><h1>SUE.<br><em>DEFEND.</em><br>WIN.</h1><p>Invite a real player, file a fictional case, and take the argument to court. Game currency only. No real legal consequences.</p></section>
  <section class="grid"><form id="f" class="panel" novalidate><h2>${t}</h2>
  ${mode==='signup'?'<label>Username (3–20 letters, numbers, _)<input name="username" autocomplete="username" maxlength="20"></label>':''}
  <label>Email<input name="email" type="email" autocomplete="email"></label>
  ${pw?`<label>Password<input name="password" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}"></label>`:''}
  ${mode==='signup'?'<label>Confirm password<input name="confirm" type="password" autocomplete="new-password"></label>':''}
  ${pw?'<label class="chk"><input type="checkbox" id="sp"> Show password</label>':''}
  <button class="primary" id="go">${t}</button>
  <p class="mut">${mode==='signin'?'New here? <a href="#signup">Create account</a> · <a href="#forgot">Forgot password?</a>':'<a href="#signin">Back to sign in</a>'}</p></form><div class="panel"><h2>How it works</h2><p>1. Create an account and username.</p><p>2. File a case against another player (₦5,000 filing fee).</p><p>3. The defendant accepts or declines the summons.</p><p>4. Both sides argue.</p><p>5. Other players form the jury and judgment is delivered. The winner takes ₦4,000 of the fee.</p></div></section>`);
  const sp=$('#sp');if(sp)sp.onchange=()=>document.querySelectorAll('input[type=password],input[data-pw]').forEach(i=>{i.type=sp.checked?'text':'password';i.dataset.pw=1});
  $('#f').onsubmit=e=>{e.preventDefault();act($('#go'),async()=>{
    const f=Object.fromEntries(new FormData(e.target));const email=(f.email||'').trim();
    if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('Enter a valid email address.');
    if(mode==='forgot'){must(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));toast('Check your email for the reset link.');return}
    if(!f.password)throw new Error('Enter your password.');
    if(mode==='signin'){const {error}=await sb.auth.signInWithPassword({email,password:f.password});if(error)throw new Error(error.message==='Invalid login credentials'?'Wrong email or password.':error.message);return}
    const u=(f.username||'').trim();
    if(!/^[A-Za-z0-9_]{3,20}$/.test(u))throw new Error('Username must be 3–20 letters, numbers or underscores.');
    if(f.password.length<8||!/\d/.test(f.password)||!/[A-Za-z]/.test(f.password))throw new Error('Password needs 8+ characters with a letter and a number.');
    if(f.password!==f.confirm)throw new Error('Passwords do not match.');
    if(!(await rpc('username_available',{p_name:u})))throw new Error('That username is taken.');
    const {data,error}=await sb.auth.signUp({email,password:f.password,options:{data:{username:u}}});
    if(error)throw new Error(/registered/i.test(error.message)?'That email already has an account. Sign in instead.':error.message);
    if(data.user&&data.user.identities&&data.user.identities.length===0)throw new Error('That email already has an account. Sign in instead.');
    if(!data.session){shell(`<div class="panel"><h2>Check your email</h2><p>We sent a confirmation link to ${esc(email)}. Open it, then sign in.</p></div>`)}
  })};
}
function recoverView(){
  shell(`<form id="f" class="panel"><h2>Set a new password</h2><label>New password<input name="p" type="password" autocomplete="new-password"></label><button class="primary" id="go">Save password</button></form>`);
  $('#f').onsubmit=e=>{e.preventDefault();act($('#go'),async()=>{const p=new FormData(e.target).get('p');
    if(p.length<8)throw new Error('Password needs 8+ characters.');
    must(await sb.auth.updateUser({password:p}));recovering=false;toast('Password updated.');location.hash='#/';route()})};
}

    sb.from('cases').select(SEL).order('created_at',{ascending:false}).then(must),

  const mine=cases.filter(c=>c.plaintiff_id===me.id||c.defendant_id===me.id);

  shell(`<h2>Court is now in session, ${esc(me_name)}</h2>

  <h2>Jury docket</h2><p class="mut">Cases waiting for jurors. Cast your vote.</p>${jury.map(caseCard).join('')||'<p class="mut">Nothing waiting right now.</p>'}${blocked.length?`<h2>Blocked players</h2><div class="panel">${blocked.map(b=>`<p>@${esc(b.blocked.username)} <button class="ghost" data-ub="${esc(b.blocked.username)}">Unblock</button></p>`).join('')}</div>`:''}`);

const b64u=k=>{const r=atob((k+'='.repeat((4-k.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function pushSub(){try{if(!pushOk())return null;const reg=await navigator.serviceWorker.ready;return await reg.pushManager.getSubscription()}catch(_){return null}}
async function enablePush(){
  if(!pushOk())throw new Error('This browser cannot receive alerts. On iPhone: tap Share, then Add to Home Screen, and open Naija Court from your home screen.');
  if(await Notification.requestPermission()!=='granted')throw new Error('Alerts are blocked. Allow notifications for Naija Court in your phone settings.');
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
  const j=sub.toJSON();await rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
}

  const road='M180 580 C180 540 100 520 130 470 S250 400 205 330 S110 270 180 200 S240 160 180 140';

  <div class="mapimg" role="img" aria-label="Court map"><img src="map.jpg.jpeg" alt="" onerror="this.style.display='none'">${animSvg()}
  ${[['supreme',33,13.5,34,24],['appeal',15,40,43,22],['high',29,64,42,25]].map(([k,l,t,w,h])=>`<button class="hot${mapSel===k?' sel':''}" data-court="${k}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%" aria-label="${COURTS[k].name}"><span>${COURTS[k].seal} ${COURTS[k].name}<small>${cnt(k)} case${cnt(k)===1?'':'s'}</small></span></button>`).join('')}
  ${bbSvg()}</div>
  <div class="panel"><h3 style="margin:0">${C.seal} ${C.name}</h3><p class="muted small">Hears: ${C.cats.map(k=>CATS[k]).join(', ')}</p><p class="muted small">${nx?`Appeals from here go to the ${COURTS[nx].name}.`:'This is the final court. Its verdict cannot be appealed.'}</p><button class="primary" id="fh">File a case in the ${C.name}</button></div>
  <h3>Your cases here</h3>${list.map(caseCard).join('')||'<p class="muted">None yet.</p>'}`);
  attachVideo();
  document.querySelectorAll('[data-court]').forEach(g=>g.onclick=()=>{mapSel=g.dataset.court;courtMap()});
  $('#fh').onclick=()=>{prefCourt=mapSel;location.hash='#/new'};
}

async function appealsView(){
  const [cases,js]=await Promise.all([sb.from('cases').select(SEL).order('created_at',{ascending:false}).then(must),sb.from('judgments').select('case_id,winner').then(must)]);
  const mine=cases.filter(c=>c.plaintiff_id===me.id||c.defendant_id===me.id);
  const lost=mine.filter(c=>{const j=js.find(x=>x.case_id===c.id);return NEXT[c.court||'high']&&c.status==='decided'&&j&&j.winner!=='draw'&&((j.winner==='claimant'&&c.defendant_id===me.id)||(j.winner==='defendant'&&c.plaintiff_id===me.id))});
  shell(`<h2>🔄 Appeals</h2><p class="muted small">Lost a case? Appeal it to the next court up: High Court → Appeal Chambers (₦3,000) → Supreme Bench (₦5,000).</p>
  <h3>You can appeal these</h3>${lost.map(caseCard).join('')||'<p class="muted">Nothing to appeal.</p>'}
  <h3>Cases that were appealed</h3>${mine.filter(c=>c.appealed_by).map(caseCard).join('')||'<p class="muted">No appeals yet.</p>'}`);
}
async function profileView(){
  const [cases,js]=await Promise.all([sb.from('cases').select('id,plaintiff_id,defendant_id').then(must),sb.from('judgments').select('case_id,winner').then(must)]);
  const mine=cases.filter(c=>c.plaintiff_id===me.id||c.defendant_id===me.id),dec=js.filter(j=>mine.some(c=>c.id===j.case_id));
  const won=dec.filter(j=>{const c=mine.find(x=>x.id===j.case_id);return (j.winner==='claimant'&&c.plaintiff_id===me.id)||(j.winner==='defendant'&&c.defendant_id===me.id)}).length;
  shell(`<div class="panel"><div class="who">${avh(me_name,me_avatar,64)}<div><h2 style="margin:0">@${esc(me_name)}</h2><span class="muted small">${esc(me.email)}</span></div></div><p class="muted small" style="margin:12px 0 6px">Choose your avatar</p><div class="row">${[1,2,3,4,5,6,7,8].map(i=>`<button data-av="${i}" class="ghost" style="padding:2px;border-radius:50%;border-color:${i===me_avatar?'#e6bd62':'transparent'}">${avh('',i,48)}</button>`).join('')}</div></div>
  <div class="panel"><p>💰 Wallet: <b>₦${Number(me_wallet).toLocaleString()}</b></p><p>📁 Cases filed or received: <b>${mine.length}</b></p><p>🏆 Cases won: <b>${won}</b> of ${dec.length} decided</p></div>`);
  document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>act(b,async()=>{await rpc('set_avatar',{p_avatar:+b.dataset.av});me_avatar=+b.dataset.av;toast('Avatar saved.');profileView()}));
}
function moreView(){
  shell(`<h2>More</h2><a class="panel case" href="#/leaders">🏆 Leaderboard</a><a class="panel case" href="#/alerts">🔔 Notifications and phone alerts</a><a class="panel case" href="#/cases">🚫 My cases and blocked players</a><button class="primary" id="so">Sign out</button>`);
  $('#so').onclick=()=>sb.auth.signOut();
}

// ---- Router / boot ----
let live=null,quiet=false,tmr=null,rec=null,ctab='a';
function startLive(){
  if(live)return;
  const kick=()=>{clearTimeout(tmr);tmr=setTimeout(async()=>{
    const h=location.hash.replace(/^#\/?/,''),el=document.activeElement;
    if(h==='new'||rec||(el&&/INPUT|TEXTAREA|SELECT/.test(el.tagName)))return;
    quiet=true;try{await route()}finally{quiet=false}},700)};
  live=sb.channel('naija-live').on('postgres_changes',{event:'*',schema:'public'},kick).subscribe();
  live.poll=setInterval(kick,30000);
}
function stopLive(){if(live){clearInterval(live.poll);sb.removeChannel(live);live=null}}

async function route(){
  if(recovering)return recoverView();
  const h=location.hash.replace(/^#\/?/,'');
  if(!me){stopLive();return authView(h==='signup'?'signup':h==='forgot'?'forgot':'signin')}
  try{
    {const p=await sb.from('profiles').select('username,wallet,avatar').eq('id',me.id).maybeSingle().then(must);me_name=p?.username||'player';me_wallet=p?.wallet??0;me_avatar=p?.avatar||0;me_unread=(await sb.from('notifications').select('id',{count:'exact',head:true}).eq('read',false)).count||0}
    startLive();if(h==='new')return newCase();if(h==='leaders')return leaders();if(h==='map')return courtMap();if(h==='cases')return dashboard();if(h==='appeals')return appealsView();if(h==='profile')return profileView();if(h==='more')return moreView();if(h==='alerts')return alerts();
    if(h.startsWith('case/'))return await caseView(h.slice(5));
    await courtMap();
  }catch(e){shell(`<div class="panel"><b>Could not load.</b><p>${esc(e.message)}</p><p class="mut">Has the SQL migration been applied?</p></div>`)}
}
window.addEventListener('hashchange',route);
(async function boot(){
  if(!window.supabase)return shell('<div class="panel"><b>Supabase library failed to load.</b><p class="mut">Check your connection or content blockers.</p></div>');
  if(CFG.key.startsWith('PASTE_'))return shell('<div class="panel"><b>Setup needed:</b> open index.html and set CFG.key to your Supabase publishable (anon) key.</div>');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data}=await sb.auth.getSession();me=data.session?.user||null;
  sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>{
    if(ev==='PASSWORD_RECOVERY')recovering=true;
    const u=s?.user||null;if(!u)me_name='';
    if(ev==='TOKEN_REFRESHED'&&u&&me&&u.id===me.id)return;
    me=u;route()},0));
  route();
})();
</script>
