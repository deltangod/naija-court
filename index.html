<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naija Court</title>
<style>
:root{--bg:#0e1626;--card:#16213a;--line:#263556;--ink:#f6efdc;--mut:#a9b3c7;--gold:#d4a73a;--red:#e2584d;--grn:#3fb27f}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav{display:flex;gap:10px;align-items:center}
a{color:var(--gold)}.brand{font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px}
footer{max-width:640px;margin:0 auto;padding:16px;color:var(--mut);font-size:.8rem}
h1{font-size:2rem;line-height:1.15;margin:.3em 0}h1 span{color:var(--gold)}h2{margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;margin:10px 0;color:var(--mut);font-size:.9rem}
input,select,textarea{width:100%;margin-top:4px;padding:12px;font:inherit;color:var(--ink);background:#0e1626;border:1px solid var(--line);border-radius:10px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
.btn,.ghost{font:inherit;font-weight:700;border-radius:10px;padding:12px 16px;min-height:44px;cursor:pointer;border:1px solid var(--gold)}
.btn{background:var(--gold);color:#1a1405;width:100%;margin-top:8px}.ghost{background:none;color:var(--gold)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn:disabled{opacity:.5}
.steps{color:var(--mut);padding-left:20px}
.pill{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--gold)}
.case{display:block;text-decoration:none;color:var(--ink)}.mut{color:var(--mut);font-size:.9rem}
.arg{border-left:3px solid var(--gold);padding-left:10px;margin:10px 0}
.verdict{border:2px solid var(--gold);text-align:center}
#toast{position:fixed;left:12px;right:12px;bottom:12px;padding:12px 14px;border-radius:10px;background:var(--grn);color:#04150d;font-weight:600;display:none;z-index:9}
#toast.bad{background:var(--red);color:#fff}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
</style></head>
<body>
<div id="app"><main><p>Loading court…</p></main></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ---- Config: the key must be the PUBLISHABLE / anon key only. Never the service_role key. ----
const CFG={url:'https://gywrvnvbsboyxknuajmh.supabase.co',key:'sb_publishable_4y7wiDNQTcDuSgtFwhb3bg_lx9VitOt'};
const CATS={money:'Money wahala',friendship:'Friendship drama',relationship:'Relationship matter',food:'Stolen food (suya!)',promise:'Broken promise',property:'Property / borrowed things',other:'Miscellaneous'};
const STATUS={awaiting_response:'Awaiting response',in_progress:'In progress',awaiting_judgment:'Before the jury',decided:'Decided',dismissed:'Dismissed'};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb,me=null,me_name='',recovering=false;

function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}
window.addEventListener('error',e=>toast('Script error: '+e.message,1));
window.addEventListener('unhandledrejection',e=>toast(e.reason?.message||String(e.reason),1));
const must=r=>{if(r.error)throw r.error;return r.data};
const rpc=(fn,a)=>sb.rpc(fn,a).then(must);
async function act(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(e.message||'Something went wrong',1)}finally{if(btn)btn.disabled=false}}

function shell(inner){
  app.innerHTML=`<header><a class="brand" href="#/">⚖️ Naija Court</a><nav>${me?`<a href="#/new">File case</a><button class="ghost" id="out">Log out</button>`:''}</nav></header>
  <main>${inner}</main>
  <footer>Naija Court is a game. Judgments are entertainment only, not real court orders or legal advice. Play nice: no harassment, threats or doxxing.</footer>`;
  const o=$('#out');if(o)o.onclick=()=>sb.auth.signOut();
}

// ---- Auth ----
function authView(mode){
  const t={signin:'Enter court',signup:'Create account',forgot:'Reset password'}[mode];
  const pw=mode!=='forgot';
  shell(`<section><h1>Take your friend to court.<br><span>Make the jury judge am.</span></h1>
  <p class="mut">File a funny dispute, summon the defendant, trade arguments, and let other players deliver judgment.</p>
  <ol class="steps"><li>File a case</li><li>Defendant answers the summons</li><li>Both sides argue</li><li>Jury votes, judgment delivered</li></ol></section>
  <form id="f" class="card" novalidate><h2>${t}</h2>
  ${mode==='signup'?'<label>Username (3–20 letters, numbers, _)<input name="username" autocomplete="username" maxlength="20"></label>':''}
  <label>Email<input name="email" type="email" autocomplete="email"></label>
  ${pw?`<label>Password<input name="password" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}"></label>`:''}
  ${mode==='signup'?'<label>Confirm password<input name="confirm" type="password" autocomplete="new-password"></label>':''}
  ${pw?'<label class="chk"><input type="checkbox" id="sp"> Show password</label>':''}
  <button class="btn" id="go">${t}</button>
  <p class="mut">${mode==='signin'?'New here? <a href="#signup">Create account</a> · <a href="#forgot">Forgot password?</a>':'<a href="#signin">Back to sign in</a>'}</p></form>`);
  const sp=$('#sp');if(sp)sp.onchange=()=>document.querySelectorAll('input[type=password],input[data-pw]').forEach(i=>{i.type=sp.checked?'text':'password';i.dataset.pw=1});
  $('#f').onsubmit=e=>{e.preventDefault();act($('#go'),async()=>{
    const f=Object.fromEntries(new FormData(e.target));const email=(f.email||'').trim();
    if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('Enter a valid email address.');
    if(mode==='forgot'){must(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));toast('Check your email for the reset link.');return}
    if(!f.password)throw new Error('Enter your password.');
    if(mode==='signin'){const {error}=await sb.auth.signInWithPassword({email,password:f.password});if(error)throw new Error(error.message==='Invalid login credentials'?'Wrong email or password.':error.message);return}
    const u=(f.username||'').trim();
    if(!/^[A-Za-z0-9_]{3,20}$/.test(u))throw new Error('Username must be 3–20 letters, numbers or underscores.');
    if(f.password.length<8||!/\d/.test(f.password)||!/[A-Za-z]/.test(f.password))throw new Error('Password needs 8+ characters with a letter and a number.');
    if(f.password!==f.confirm)throw new Error('Passwords do not match.');
    if(!(await rpc('username_available',{p_name:u})))throw new Error('That username is taken.');
    const {data,error}=await sb.auth.signUp({email,password:f.password,options:{data:{username:u}}});
    if(error)throw new Error(/registered/i.test(error.message)?'That email already has an account. Sign in instead.':error.message);
    if(data.user&&data.user.identities&&data.user.identities.length===0)throw new Error('That email already has an account. Sign in instead.');
    if(!data.session){shell(`<div class="card"><h2>Check your email</h2><p>We sent a confirmation link to ${esc(email)}. Open it, then sign in.</p></div>`)}
  })};
}
function recoverView(){
  shell(`<form id="f" class="card"><h2>Set a new password</h2><label>New password<input name="p" type="password" autocomplete="new-password"></label><button class="btn" id="go">Save password</button></form>`);
  $('#f').onsubmit=e=>{e.preventDefault();act($('#go'),async()=>{const p=new FormData(e.target).get('p');
    if(p.length<8)throw new Error('Password needs 8+ characters.');
    must(await sb.auth.updateUser({password:p}));recovering=false;toast('Password updated.');location.hash='#/';route()})};
}

// ---- Game views ----
const nm=c=>`${esc(c.claimant?.username)} v ${esc(c.defendant?.username)}`;
const SEL='*,claimant:profiles!cases_claimant_id_fkey(username),defendant:profiles!cases_defendant_id_fkey(username)';
function caseCard(c){return `<a class="card case" href="#/case/${c.id}"><span class="pill">${STATUS[c.status]||c.status}</span> <span class="mut">#${c.case_no} · ${CATS[c.category]}</span><h3 style="margin:.3em 0">${esc(c.title)}</h3><span class="mut">${nm(c)}</span></a>`}

async function dashboard(){
  shell('<p>Loading…</p>');
  const [cases,notes]=await Promise.all([
    sb.from('cases').select(SEL).order('created_at',{ascending:false}).then(must),
    sb.from('notifications').select('*').eq('read',false).order('created_at',{ascending:false}).limit(8).then(must)]);
  const mine=cases.filter(c=>c.claimant_id===me.id||c.defendant_id===me.id);
  const jury=cases.filter(c=>c.status==='awaiting_judgment'&&!mine.includes(c));
  shell(`<h2>Court is now in session, ${esc(me_name)}</h2>
  <a class="btn" style="display:block;text-align:center;text-decoration:none" href="#/new">File a new case</a>
  ${notes.length?`<div class="card"><b>Notifications</b>${notes.map(n=>`<p><a href="#/case/${n.case_id}" data-n="${n.id}">${esc(n.message)}</a></p>`).join('')}</div>`:''}
  <h2>My cases</h2>${mine.map(caseCard).join('')||'<p class="mut">No cases yet. File one!</p>'}
  <h2>Jury docket</h2><p class="mut">Cases waiting for jurors. Cast your vote.</p>${jury.map(caseCard).join('')||'<p class="mut">Nothing waiting right now.</p>'}`);
  document.querySelectorAll('[data-n]').forEach(a=>a.onclick=()=>sb.from('notifications').update({read:true}).eq('id',a.dataset.n).then(()=>{}));
}

function newCase(){
  shell(`<form id="f" class="card"><h2>File a case</h2>
  <label>Defendant's username<input name="d" autocapitalize="off"></label>
  <label>Case title<input name="t" maxlength="120" placeholder="The Case of the Missing Suya"></label>
  <label>Category<select name="c">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
  <label>What happened? (your allegation)<textarea name="s" rows="5" maxlength="2000"></textarea></label>
  <label>What do you want as remedy?<input name="r" maxlength="300" placeholder="Refund + public apology"></label>
  <p class="mut">Allegations are claims, not proven facts. Keep it fun and respectful.</p>
  <button class="btn" id="go">Summon defendant</button></form>`);
  $('#f').onsubmit=e=>{e.preventDefault();act($('#go'),async()=>{const f=Object.fromEntries(new FormData(e.target));
    const id=await rpc('file_case',{p_defendant:f.d.trim(),p_title:f.t.trim(),p_category:f.c,p_description:f.s.trim(),p_remedy:f.r.trim()});
    toast('The defendant has been summoned.');location.hash='#/case/'+id})};
}

async function caseView(id){
  shell('<p>Loading…</p>');
  const c=(await sb.from('cases').select(SEL).eq('id',id).maybeSingle().then(must));
  if(!c)return shell('<div class="card">Case not found, or it is private.</div>');
  const [args,evs,j,votes]=await Promise.all([
    sb.from('case_arguments').select('*,author:profiles!case_arguments_author_id_fkey(username)').eq('case_id',id).order('created_at').then(must),
    sb.from('case_events').select('*').eq('case_id',id).order('created_at').then(must),
    sb.from('judgments').select('*').eq('case_id',id).maybeSingle().then(must),
    sb.from('case_votes').select('voter_id,side').eq('case_id',id).then(must)]);
  const isC=c.claimant_id===me.id,isD=c.defendant_id===me.id,party=isC||isD,voted=votes.some(v=>v.voter_id===me.id);
  let actions='';
  if(isD&&c.status==='awaiting_response')actions=`<div class="card"><b>You don been summoned.</b><div class="row"><button class="btn" data-a="acc">Accept summons</button><button class="btn red" data-a="dec">Decline</button></div></div>`;
  else if(party&&c.status==='in_progress')actions=`<form id="af" class="card"><label>Counsel, present your case<textarea name="b" rows="4" maxlength="1500"></textarea></label><button class="btn" id="ab">Submit argument</button><button type="button" class="btn ghost" data-a="rest">Rest my case (send to jury)</button></form>`;
  else if(!party&&c.status==='awaiting_judgment'){const a=votes.filter(v=>v.side==='claimant').length,b=votes.length-a;
    actions=`<div class="card"><b>Jury box</b><p class="mut">${votes.length} vote(s) cast. Judgment needs at least 3.</p>${voted?'<p>You have voted.</p>':`<div class="row"><button class="btn" data-a="vc">Claimant is right</button><button class="btn" data-a="vd">Defendant is right</button></div>`}<button class="btn ghost" data-a="jdg">Deliver judgment</button></div>`}
  const winner=j&&{claimant:c.claimant.username,defendant:c.defendant.username,draw:'Nobody (draw)'}[j.winner];
  shell(`<span class="pill">${STATUS[c.status]||c.status}</span> <span class="mut">Case #${c.case_no} · ${CATS[c.category]}</span>
  <h2>${esc(c.title)}</h2><p class="mut">${nm(c)}</p>
  <div class="card"><b>Allegation (not proven fact)</b><p>${esc(c.description)}</p><b>Remedy sought</b><p>${esc(c.remedy)}</p></div>
  ${j?`<div class="card verdict"><h2>⚖️ Judgment</h2><h3>Winner: ${esc(winner)}</h3><p>${j.claimant_votes} – ${j.defendant_votes}</p><p>${esc(j.reasoning)}</p><button class="ghost" id="sh">Share summary</button></div>`:''}
  ${actions}
  <h3>Arguments</h3>${args.map(a=>`<div class="arg"><b>${esc(a.author.username)}</b><br>${esc(a.body)}</div>`).join('')||'<p class="mut">None yet.</p>'}
  <h3>Case history</h3>${evs.map(e=>`<p class="mut">${new Date(e.created_at).toLocaleString()} · ${esc(e.event)}</p>`).join('')}`);
  const run=(btn,fn,msg)=>act(btn,async()=>{await fn();if(msg)toast(msg);caseView(id)});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='acc')run(b,()=>rpc('respond_case',{p_case:id,p_accept:true}),'Court is now in session.');
    if(a==='dec')run(b,()=>rpc('respond_case',{p_case:id,p_accept:false}));
    if(a==='rest')run(b,()=>rpc('rest_case',{p_case:id}));
    if(a==='vc'||a==='vd')run(b,()=>rpc('cast_vote',{p_case:id,p_side:a==='vc'?'claimant':'defendant'}),'Vote recorded.');
    if(a==='jdg')run(b,()=>rpc('deliver_judgment',{p_case:id}),'Judgment has been delivered.')});
  const af=$('#af');if(af)af.onsubmit=e=>{e.preventDefault();run($('#ab'),()=>rpc('submit_argument',{p_case:id,p_body:new FormData(af).get('b').trim()}),'Evidence submitted.')};
  const sh=$('#sh');if(sh)sh.onclick=async()=>{const t=`Naija Court: ${c.title} — winner: ${winner} (${j.claimant_votes}-${j.defendant_votes}). For fun only!`;
    try{navigator.share?await navigator.share({text:t,url:location.href}):(await navigator.clipboard.writeText(t+' '+location.href),toast('Summary copied.'))}catch(_){}};
}

// ---- Router / boot ----
async function route(){
  if(recovering)return recoverView();
  const h=location.hash.replace(/^#\/?/,'');
  if(!me)return authView(h==='signup'?'signup':h==='forgot'?'forgot':'signin');
  try{
    if(!me_name){const p=await sb.from('profiles').select('username').eq('id',me.id).maybeSingle().then(must);me_name=p?.username||'player'}
    if(h==='new')return newCase();
    if(h.startsWith('case/'))return await caseView(h.slice(5));
    await dashboard();
  }catch(e){shell(`<div class="card"><b>Could not load.</b><p>${esc(e.message)}</p><p class="mut">Has the SQL migration been applied?</p></div>`)}
}
window.addEventListener('hashchange',route);
(async function boot(){
  if(!window.supabase)return shell('<div class="card"><b>Supabase library failed to load.</b><p class="mut">Check your connection or content blockers.</p></div>');
  if(CFG.key.startsWith('PASTE_'))return shell('<div class="card"><b>Setup needed:</b> open index.html and set CFG.key to your Supabase publishable (anon) key.</div>');
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data}=await sb.auth.getSession();me=data.session?.user||null;
  sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>{
    if(ev==='PASSWORD_RECOVERY')recovering=true;
    const u=s?.user||null;if(!u)me_name='';
    if(ev==='TOKEN_REFRESHED'&&u&&me&&u.id===me.id)return;
    me=u;route()},0));
  route();
})();
</script>
</body></html>
